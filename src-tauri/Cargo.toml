[package]
name = "termpane"
version = "0.4.0"
description = "TermPane — native, lightweight terminal manager (Tauri + portable-pty)"
authors = ["jonas@silveira.eti.br"]
edition = "2021"

[lib]
name = "termpane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
parking_lot = "0.12"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["term", "process", "fs", "user"] }
dirs = "5"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
tauri-plugin-notification = "2"
vt100 = "0.15"

# Native macOS wake handling (recover the WKWebView after sleep/hibernate). All
# of these are already pulled in transitively by wry at these exact versions, so
# declaring them direct adds no new dependency to the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKNavigation"] }
block2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
